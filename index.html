<title>Consulta de clientes Holmes — quem atende quem</title>
<style>
  :root{
    color-scheme:light;
    --navy:#24305e;
    --surface:#fcfcfb; --plane:#f4f4f1;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --line:#c3c2b7; --border:rgba(11,11,11,.12);
    --agm1:#2a78d6; --agm2:#eb6834; --agm3:#1baf7a; --agm4:#4a3aa7; --agm0:#6f6d67;
    --agm5:#c2287a; --agm6:#0d8f9e; --agm7:#a8620e; --agm8:#5d7a17; --agm9:#b0243a;
    --good:#0ca30c; --warn:#fab219; --info:#2a78d6;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-padding-top:190px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--plane);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:1400px;margin:0 auto;
    padding:0 max(16px,env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom))}

  .sticky{position:sticky;top:0;z-index:20;background:var(--plane);
    padding:max(14px,env(safe-area-inset-top)) 16px 12px;margin:0 -16px;border-bottom:1px solid var(--border);
    box-shadow:0 6px 18px -14px rgba(0,0,0,.35)}
  .sticky .inner{max-width:1368px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .brand img{height:26px;width:auto;display:block}
  .brand .ttl{font-size:14px;font-weight:600;color:var(--ink)}
  .brand .sep{width:1px;height:20px;background:var(--line)}
  .brand .ev{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}

  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  #q{width:100%;font:inherit;font-size:17px;padding:15px 46px 15px 44px;border-radius:14px;
     border:1.5px solid var(--border);background:var(--surface);color:var(--ink)}
  #q::placeholder{color:var(--muted)}
  #q:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,48,94,.14)}
  #clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;display:none}

  .agmrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:8px;margin-top:10px}
  .agmrow2{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;align-items:center}
  .agmrow2 .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
  .agmmini{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:99px;padding:6px 11px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink2)}
  .agmmini:hover{border-color:var(--line)}
  .depchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:99px;padding:6px 11px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink2)}
  .depchip:hover{border-color:var(--line)}
  .depchip[aria-pressed="true"]{border-color:var(--navy);color:var(--ink);background:rgba(36,48,94,.06);
    box-shadow:inset 0 0 0 1px var(--navy)}
  .depchip .ct{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650}
  .deps{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center;
    border-top:1px solid var(--grid);padding-top:9px}
  .deps .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    flex:0 0 100%;margin-bottom:1px}
  .deps .dp{font-size:11.5px;color:var(--ink2);background:var(--plane);border:1px solid var(--border);
    border-radius:99px;padding:3px 9px;line-height:1.3}
  .agmmini[aria-pressed="true"]{border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}
  .agmmini .sw{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
  .agmmini .ct{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650}
  .agmbtn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:10px;padding:9px 9px;cursor:pointer;font:inherit;text-align:left;min-height:46px}
  .agmbtn:hover{border-color:var(--line)}
  .agmbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));
    box-shadow:inset 0 0 0 1px var(--c)}
  .agmbtn .sw{width:9px;height:22px;border-radius:3px;background:var(--c);flex:none}
    .agmbtn .nm{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
  .agmbtn .ct{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:650;
    background:var(--plane);border-radius:99px;padding:2px 6px;flex:none}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  select{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--ink);max-width:210px}
  select:focus{outline:none;border-color:var(--navy)}
  .btn{font:inherit;font-size:14px;padding:10px 13px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--ink2);cursor:pointer}
  .btn:hover{border-color:var(--line)}
  .count{margin-left:auto;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .count b{color:var(--ink)}
  .mobbar{display:none;align-items:center;gap:10px;margin-top:10px}
  .filtbtn{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
  .fbadge{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--navy);color:#fff;
    border-radius:99px;min-width:19px;height:19px;display:none;align-items:center;justify-content:center;padding:0 5px}
  .fbadge.on{display:inline-flex}
  .filtbtn[aria-expanded="true"]{border-color:var(--navy)}

  .tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:16px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
  th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
     font-weight:650;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
     background:var(--surface);cursor:pointer;user-select:none;position:sticky;top:var(--sh,0px);z-index:10;
     box-shadow:0 1px 0 var(--border)}
  th:first-child{border-top-left-radius:var(--r)} th:last-child{border-top-right-radius:var(--r)}
  th:hover{color:var(--ink2)}
  th .ar{opacity:.45;font-size:10px}
  td{padding:12px 14px;border-bottom:1px solid var(--grid);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#f6f6f3}
  .cli{font-weight:600;font-size:14.5px}
  .agmcell{display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600}
  .agmcell .sw{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
  .dim{color:var(--ink2)}
  .appid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--plane);
    border:1px solid var(--border);border-radius:7px;padding:4px 8px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px}
  .appid:hover{border-color:var(--line)}
  .appid.ok{border-color:var(--good);color:var(--good)}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;color:var(--ink2)}
  .st i{width:7px;height:7px;border-radius:99px;flex:none}
  .st.prod i{background:var(--good)} .st.impl i{background:var(--warn)} .st.adoc i{background:var(--info)}

  .cards{display:none;margin-top:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);
    border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
  .card .cn{font-size:17px;font-weight:650;line-height:1.25;margin-bottom:9px}
  .card .agm{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;color:var(--ink);margin-bottom:8px}
  .card .agm .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
  .card .agm .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink2);align-items:center}
  .card .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:4px}

  .empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:48px 20px;text-align:center;color:var(--muted);margin-top:16px}
  .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  footer{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}
  .kbd{font-family:ui-monospace,monospace;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;padding:1px 5px;font-size:11px}

  @media (max-width:900px){
    .tblwrap{display:none} .cards{display:block}
    .brand{gap:9px;margin-bottom:10px} .brand img{height:22px} .brand .ev{display:none}
    .brand .ttl{font-size:13px}
    #q{font-size:16px;padding:13px 44px 13px 42px}
    select,.btn{font-size:16px}
    .mobbar{display:flex}
    #panel{display:none;margin-top:10px;max-height:58vh;max-height:58dvh;overflow-y:auto;overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      border-top:1px solid var(--border);padding-top:10px}
    #panel.open{display:block}
    .agmrow{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0}
    #deprow .lb{flex:0 0 100%}
    .agmbtn{min-height:52px}
    .agmbtn .nm{white-space:normal;overflow:visible;text-overflow:clip;font-size:12.5px;line-height:1.2}
    .filters{margin-top:9px}
    select{max-width:none;flex:1 1 46%;min-width:0}
    .deskonly{display:none}
    #reset{flex:1 1 30%}
    #panel{max-height:52vh;max-height:52dvh}
  }
  @media print{
    .sticky{position:static;box-shadow:none} .agmrow,.filters,#clearq{display:none}
    .cards{display:none} .tblwrap{display:block;border:none}
    body{background:#fff} tbody tr{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

const AGMC = {"Edú Saldaña": "var(--agm5)", "Victor Filippini": "var(--agm1)", "Diego Silva": "var(--agm2)", "Adrielly Marques": "var(--agm3)", "Tatiane Souza": "var(--agm4)", "Isabella Ruiz Nascimento": "var(--agm6)"};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const depShort=d=>{const m=d.match(/\(([A-ZÁ-Ú]{2,4})\)/); if(m) return m[1];
  return d.split('/')[0].trim();};
ROWS.forEach(r=>{r._d = (r.d||'').split(';').map(x=>x.trim()).filter(Boolean);
  r._s = fold([r.n,r.c,r.uf,r.a,r.g,r.v,r.e,r.sg,r.d].join(' ')); r.color = AGMC[r.g]||'var(--agm0)';});

const UFNAME={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',
ES:'Espírito Santo',FL:'Flórida (EUA)',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',
PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',
RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};

/* ---- AGM buttons ---- */
const agmCounts={}; ROWS.forEach(r=>agmCounts[r.g]=(agmCounts[r.g]||0)+1);
const agms=Object.keys(agmCounts).sort((a,b)=>agmCounts[b]-agmCounts[a]||a.localeCompare(b));
let selAGM=new Set();
const MAIN=agms.filter(g=>agmCounts[g]>=10), REST=agms.filter(g=>agmCounts[g]<10);
document.getElementById('agmrow').innerHTML = MAIN.map(g=>`<button class="agmbtn" data-g="${esc(g)}"
  aria-pressed="false" style="--c:${AGMC[g]||'var(--agm0)'}" title="${esc(g)} — ${agmCounts[g]} clientes">
  <span class="sw"></span><span class="nm">${esc(g)}</span><span class="ct">${agmCounts[g]}</span></button>`).join('');
document.getElementById('agmrow2').innerHTML = REST.length
  ? `<span class="lb">Outros</span>`+REST.map(g=>`<button class="agmmini" data-g="${esc(g)}" aria-pressed="false"
      style="--c:${AGMC[g]||'var(--agm0)'}"><span class="sw"></span>${esc(g)}<span class="ct">${agmCounts[g]}</span></button>`).join('')
  : '';

/* ---- chips de departamento (multiselecao) ---- */
const depCounts={}; ROWS.forEach(r=>r._d.forEach(d=>depCounts[d]=(depCounts[d]||0)+1));
const deps=Object.keys(depCounts).sort((a,b)=>depCounts[b]-depCounts[a]||a.localeCompare(b,'pt-BR'));
let selDEP=new Set();
document.getElementById('deprow').innerHTML = deps.length
  ? `<span class="lb">Departamentos</span>`+deps.map(d=>`<button class="depchip" data-d="${esc(d)}"
      aria-pressed="false" title="${esc(d)}">${esc(depShort(d))}<span class="ct">${depCounts[d]}</span></button>`).join('')
  : '';

/* ---- UF select ---- */
const sgs=[...new Set(ROWS.map(r=>r.sg).filter(Boolean))]
  .sort((a,b)=>ROWS.filter(r=>r.sg===b).length-ROWS.filter(r=>r.sg===a).length||a.localeCompare(b,'pt-BR'));
document.getElementById('fsg').insertAdjacentHTML('beforeend',
  sgs.map(g=>`<option>${esc(g)}</option>`).join(''));

const ufs=[...new Set(ROWS.map(r=>r.uf))].sort((a,b)=>(UFNAME[a]||a).localeCompare(UFNAME[b]||b));
document.getElementById('fuf').insertAdjacentHTML('beforeend',
  ufs.map(u=>`<option value="${esc(u)}">${esc(UFNAME[u]||u)} (${ROWS.filter(r=>r.uf===u).length})</option>`).join(''));

function fillCities(){
  const uf=document.getElementById('fuf').value, st=document.getElementById('fst').value,
        sg=document.getElementById('fsg').value;
  const pool=ROWS.filter(r=>(!uf||r.uf===uf)&&(!st||r.st===st)&&(!sg||r.sg===sg)
    &&(!selAGM.size||selAGM.has(r.g))&&(!selDEP.size||r._d.some(d=>selDEP.has(d))));
  const cs=[...new Set(pool.map(r=>r.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const sel=document.getElementById('fcid'), prev=sel.value;
  sel.innerHTML=`<option value="">Todas as cidades</option>`+cs.map(c=>`<option>${esc(c)}</option>`).join('');
  if(cs.includes(prev)) sel.value=prev;
}

/* ---- sorting ---- */
const COLS=[
  {k:'n', l:'Cliente'},{k:'g', l:'AGM responsável'},{k:'uf',l:'UF'},{k:'c', l:'Cidade'},
  {k:'sg',l:'Segmento'},{k:'a', l:'App Id'},{k:'v', l:'Versão Holmes'},{k:'e', l:'ERP/DMS'},{k:'st',l:'Status'}];
let sortK='n', sortD=1;

function filtered(){
  const q=fold(document.getElementById('q').value.trim());
  const uf=document.getElementById('fuf').value, cid=document.getElementById('fcid').value,
        st=document.getElementById('fst').value, sg=document.getElementById('fsg').value;
  const terms=q?q.split(/\s+/):[];
  let out=ROWS.filter(r=>(!uf||r.uf===uf)&&(!cid||r.c===cid)&&(!st||r.st===st)&&(!sg||r.sg===sg)
    &&(!selAGM.size||selAGM.has(r.g))&&(!selDEP.size||r._d.some(d=>selDEP.has(d)))
    &&terms.every(t=>r._s.includes(t)));
  out.sort((a,b)=>{const x=String(a[sortK]||''),y=String(b[sortK]||'');
    return (x.localeCompare(y,'pt-BR',{numeric:true})||String(a.n).localeCompare(String(b.n),'pt-BR'))*sortD;});
  return out;
}
const STC={'Produção':'prod','Implantação':'impl','Adoção':'adoc'};
const stChip=s=>s?`<span class="st ${STC[s]||'impl'}"><i></i>${esc(s)}</span>`:'';
const appid=a=>a?`<span class="appid" data-copy="${esc(a)}" title="Clique para copiar">${esc(a)}</span>`:'<span class="dim">—</span>';

function render(){
  const rows=filtered();
  document.querySelectorAll('.count').forEach(e=>e.innerHTML=`<b>${rows.length}</b> de ${ROWS.length}`);
  document.getElementById('clearq').style.display=document.getElementById('q').value?'block':'none';
  const nf=selAGM.size+selDEP.size+['fuf','fcid','fst','fsg'].filter(i=>document.getElementById(i).value).length;
  const bd=document.getElementById('fbadge'); bd.textContent=nf||''; bd.classList.toggle('on',nf>0);
  if(!rows.length){
    const html=`<div class="empty"><b>Nada encontrado</b>Tente só parte do nome, ou toque em “Limpar”.</div>`;
    document.getElementById('tblwrap').innerHTML=html; document.getElementById('cards').innerHTML=html; return;
  }
  document.getElementById('tblwrap').innerHTML=`<table><thead><tr>${COLS.map(c=>
    `<th data-k="${c.k}">${c.l} <span class="ar">${sortK===c.k?(sortD>0?'▲':'▼'):'↕'}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="cli">${esc(r.n)}</td>
      <td><span class="agmcell" style="--c:${r.color}"><span class="sw"></span>${esc(r.g)}</span></td>
      <td>${esc(r.uf)}</td><td class="dim">${esc(r.c)}</td>
      <td class="dim">${esc(r.sg)||'—'}</td><td>${appid(r.a)}</td>
      <td class="dim">${esc(r.v)||'—'}</td><td class="dim">${esc(r.e)||'—'}</td><td>${stChip(r.st)}</td>
    </tr>`).join('')}</tbody></table>`;
  document.getElementById('cards').innerHTML=rows.map(r=>`<div class="card" style="--c:${r.color}">
    <div class="cn">${esc(r.n)}</div>
    <div class="agm"><span class="sw"></span><span class="lbl">AGM</span>${esc(r.g)}</div>
    <div class="meta"><span>${esc(r.c)} · <b>${esc(r.uf)}</b></span>${appid(r.a)}</div>
    ${r.sg?`<div class="meta" style="margin-top:6px"><span><span class="k">Segmento</span>${esc(r.sg)}</span></div>`:''}
    <div class="meta" style="margin-top:7px">${stChip(r.st)}
      ${r.v?`<span><span class="k">Versão</span>${esc(r.v)}</span>`:''}
      ${r.e?`<span><span class="k">ERP</span>${esc(r.e)}</span>`:''}</div>
    ${r._d.length?`<div class="deps"><span class="k">Departamentos</span>${
      r._d.map(d=>`<span class="dp">${esc(d)}</span>`).join('')}</div>`:''}
    </div>`).join('');
}

/* ---- events ---- */
document.getElementById('q').addEventListener('input',render);
['fuf','fcid','fst','fsg'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{
  if(id!=='fcid') fillCities(); render();}));
document.getElementById('deprow').addEventListener('click',e=>{
  const b=e.target.closest('[data-d]'); if(!b) return;
  const d=b.dataset.d;
  if(selDEP.has(d)) selDEP.delete(d); else selDEP.add(d);
  b.setAttribute('aria-pressed',selDEP.has(d)); fillCities(); render();
});
['agmrow','agmrow2'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{
  const b=e.target.closest('[data-g]'); if(!b) return;
  const g=b.dataset.g;
  if(selAGM.has(g)) selAGM.delete(g); else selAGM.add(g);
  b.setAttribute('aria-pressed',selAGM.has(g)); fillCities(); render();
}));
document.getElementById('filtbtn').addEventListener('click',()=>{
  const p=document.getElementById('panel'), b=document.getElementById('filtbtn');
  const open=p.classList.toggle('open'); b.setAttribute('aria-expanded',open); setSH();});
document.getElementById('clearq').addEventListener('click',()=>{
  const i=document.getElementById('q'); i.value=''; i.focus(); render();});
document.getElementById('reset').addEventListener('click',()=>{
  document.getElementById('q').value=''; document.getElementById('fuf').value='';
  document.getElementById('fst').value=''; document.getElementById('fsg').value=''; fillCities(); document.getElementById('fcid').value='';
  selAGM.clear(); document.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed','false'));
  selDEP.clear(); document.querySelectorAll('[data-d]').forEach(b=>b.setAttribute('aria-pressed','false'));
  sortK='n'; sortD=1; render();});
document.getElementById('tblwrap').addEventListener('click',e=>{
  const th=e.target.closest('th[data-k]');
  if(th){ const k=th.dataset.k; sortD = (k===sortK)? -sortD : 1; sortK=k; render(); }});
function legacyCopy(txt){
  /* Safari em file:// nao expoe a Clipboard API; este caminho funciona no iOS */
  const el=document.createElement('textarea');
  el.value=txt; el.readOnly=true; el.contentEditable='true';
  el.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(el);
  const r=document.createRange(); r.selectNodeContents(el);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  el.setSelectionRange(0,txt.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
  s.removeAllRanges(); el.remove(); return ok;
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('.appid[data-copy]'); if(!el) return;
  const txt=el.dataset.copy; let ok=false;
  try{ if(navigator.clipboard&&isSecureContext){ await navigator.clipboard.writeText(txt); ok=true; } }catch(_){}
  if(!ok) ok=legacyCopy(txt);
  const old=el.textContent;
  el.textContent = ok ? '✓ copiado' : txt;
  if(ok){ el.classList.add('ok'); setTimeout(()=>{el.textContent=old; el.classList.remove('ok');},1100); }
  else { /* sem permissao de copia: seleciona o texto para copia manual */
    const r=document.createRange(); r.selectNodeContents(el);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
});
document.addEventListener('keydown',e=>{
  const q=document.getElementById('q');
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select();}
  if(e.key==='Escape'){q.value='';q.blur();render();}
});
/* altura da barra fixa -> cabeçalho da tabela gruda logo abaixo dela */
const bar=document.querySelector('.sticky');
const setSH=()=>{const h=Math.round(bar.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--sh',h+'px');
  document.documentElement.style.scrollPaddingTop=(h+12)+'px';};
setSH(); addEventListener('resize',setSH); new ResizeObserver(setSH).observe(bar);

fillCities(); render();
if(!matchMedia('(max-width:900px)').matches) document.getElementById('q').focus();
</script>
</body>
